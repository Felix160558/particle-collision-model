<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Deep Ice Cube — Gesture Zoom V6 OK V</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 48%, rgba(24, 33, 45, 0.92), rgba(3, 5, 10, 1) 64%, #000 100%),
        linear-gradient(180deg, #02060b, #000);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #webcam {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 0;
      filter: brightness(0.50) contrast(1.08) saturate(0.68);
      transition: opacity 0.55s ease;
      z-index: 0;
      background: #02050a;
    }

    body.camera-on #webcam { opacity: 0.38; }

    #shade {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 48%, rgba(0,0,0,0.03) 0%, rgba(0,0,0,0.12) 48%, rgba(0,0,0,0.76) 94%),
        linear-gradient(180deg, rgba(0,0,0,0.42), transparent 22%, transparent 70%, rgba(0,0,0,0.58));
    }

    #mount {
      position: fixed;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
    }

    #startOverlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.035), rgba(0,0,0,0.16) 48%, rgba(0,0,0,0.34));
      transition: opacity 0.42s ease;
    }

    #startOverlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #startPanel {
      padding: 18px 22px;
      border-radius: 22px;
      border: 1px solid rgba(235, 248, 255, 0.22);
      background: rgba(5, 10, 16, 0.46);
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 86px rgba(0,0,0,0.40);
      color: rgba(240, 250, 255, 0.92);
      text-align: center;
      min-width: 292px;
    }

    #startBtn {
      border: 1px solid rgba(240, 252, 255, 0.30);
      border-radius: 999px;
      background: rgba(255,255,255,0.10);
      color: rgba(250,253,255,0.95);
      padding: 12px 20px;
      font-size: 14px;
      letter-spacing: 0.04em;
      cursor: pointer;
    }

    #startBtn:hover { background: rgba(255,255,255,0.16); }

    #startHint {
      margin-top: 12px;
      font-size: 12px;
      color: rgba(230, 242, 250, 0.58);
      line-height: 1.55;
    }

    #status {
      position: fixed;
      z-index: 9;
      left: 16px;
      bottom: 14px;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.20);
      color: rgba(236,248,255,0.46);
      font-size: 11px;
      letter-spacing: 0.03em;
      user-select: none;
      pointer-events: none;
      transition: opacity .35s ease;
    }

    #status.hidden { opacity: 0; }
  </style>
</head>
<body>
  <video id="webcam" autoplay playsinline muted></video>
  <div id="shade"></div>
  <div id="mount"></div>

  <div id="startOverlay">
    <div id="startPanel">
      <button id="startBtn">打开摄像头手势控制</button>
      <div id="startHint">打开后界面会自动消失。测试键盘：O / 空格 = 散开，F = 聚合，1 = 拉远，2 = 拉近，H = 隐藏状态。手势：OK = 拉远，V = 拉近。</div>
    </div>
  </div>

  <div id="status">standby · 512 cubes · open hand=scatter · fist=assemble · OK=far · V=near · H hide</div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    const mount = document.getElementById("mount");
    const video = document.getElementById("webcam");
    const startOverlay = document.getElementById("startOverlay");
    const startBtn = document.getElementById("startBtn");
    const statusEl = document.getElementById("status");

    const CONFIG = {
      // V4: 方块数量从 6³ = 216 提升到 8³ = 512，视觉上约为原来的 2.37 倍。
      // 说明：如果保持完整标准大正方体网格，方块总数必须是 k³，无法精确变成 432。
      lattice: 8,
      cellSize: 0.43,
      spacing: 0.51,
      particlesPerCell: 6,
      backgroundStars: 86,
      openDistanceMin: 4.0,
      openDistanceMax: 6.9,
      particleBaseSize: 4.6,
      cameraOpacity: 0.38,
      cameraNearZ: 6.15,
      cameraBaseZ: 7.55,
      cameraFarZ: 9.15
    };

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x02070d, 0.055);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 120);
    camera.position.set(0, 0.22, CONFIG.cameraBaseZ);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.30;
    mount.appendChild(renderer.domElement);

    const clock = new THREE.Clock();

    const root = new THREE.Group();
    scene.add(root);

    const cubeRoot = new THREE.Group();
    root.add(cubeRoot);

    scene.add(new THREE.AmbientLight(0xdcefff, 1.35));

    const key = new THREE.DirectionalLight(0xffffff, 3.8);
    key.position.set(3.8, 4.7, 6.2);
    scene.add(key);

    const rimLeft = new THREE.PointLight(0xc8edff, 6.2, 19, 1.7);
    rimLeft.position.set(-4.8, 2.4, 4.2);
    scene.add(rimLeft);

    const rimRight = new THREE.PointLight(0x9fcfff, 2.8, 16, 2.0);
    rimRight.position.set(4.2, -2.6, 4.6);
    scene.add(rimRight);

    function rand(min, max) { return min + Math.random() * (max - min); }

    function randomUnitVector() {
      const z = rand(-1, 1);
      const t = rand(0, Math.PI * 2);
      const r = Math.sqrt(Math.max(0, 1 - z * z));
      return new THREE.Vector3(r * Math.cos(t), r * Math.sin(t), z);
    }

    function randomShellPoint(minR, maxR) {
      const v = randomUnitVector();
      const r = rand(minR, maxR);
      v.x *= 1.23;
      v.y *= 0.82;
      v.z *= 0.96;
      return v.multiplyScalar(r);
    }

    const cellGeo = new THREE.BoxGeometry(CONFIG.cellSize, CONFIG.cellSize, CONFIG.cellSize, 1, 1, 1);
    const edgeGeo = new THREE.EdgesGeometry(cellGeo);

    const baseIceMat = new THREE.MeshPhysicalMaterial({
      color: 0xe9f8ff,
      transparent: true,
      opacity: 0.145,
      depthWrite: false,
      roughness: 0.12,
      metalness: 0.0,
      transmission: 0.52,
      thickness: 0.78,
      ior: 1.18,
      clearcoat: 0.80,
      clearcoatRoughness: 0.20,
      emissive: 0x102636,
      emissiveIntensity: 0.16,
      side: THREE.DoubleSide
    });

    const baseEdgeMat = new THREE.LineBasicMaterial({
      color: 0xf5fcff,
      transparent: true,
      opacity: 0.64,
      blending: THREE.AdditiveBlending
    });

    const baseSoftEdgeMat = new THREE.LineBasicMaterial({
      color: 0x9bd8ff,
      transparent: true,
      opacity: 0.16,
      blending: THREE.AdditiveBlending
    });

    const cells = [];
    const offset = ((CONFIG.lattice - 1) * CONFIG.spacing) / 2;

    for (let x = 0; x < CONFIG.lattice; x++) {
      for (let y = 0; y < CONFIG.lattice; y++) {
        for (let z = 0; z < CONFIG.lattice; z++) {
          const group = new THREE.Group();
          group.scale.set(1, 1, 1);

          const assembled = new THREE.Vector3(
            x * CONFIG.spacing - offset,
            y * CONFIG.spacing - offset,
            z * CONFIG.spacing - offset
          );
          const dispersed = randomShellPoint(CONFIG.openDistanceMin, CONFIG.openDistanceMax);

          const mesh = new THREE.Mesh(cellGeo, baseIceMat.clone());
          mesh.material.opacity = rand(0.105, 0.165);
          mesh.material.emissiveIntensity = rand(0.12, 0.21);
          group.add(mesh);

          const edges = new THREE.LineSegments(edgeGeo, baseEdgeMat.clone());
          edges.material.opacity = rand(0.48, 0.72);
          group.add(edges);

          const softEdges = new THREE.LineSegments(edgeGeo, baseSoftEdgeMat.clone());
          softEdges.scale.setScalar(1.035);
          group.add(softEdges);

          group.position.copy(assembled);
          cubeRoot.add(group);

          cells.push({
            group,
            mesh,
            edges,
            softEdges,
            assembled,
            dispersed,
            phase: Math.random() * Math.PI * 2,
            rotationOpen: new THREE.Euler(rand(-0.95, 0.95), rand(-0.95, 0.95), rand(-0.95, 0.95))
          });
        }
      }
    }

    const particleCount = cells.length * CONFIG.particlesPerCell;
    const pPositions = new Float32Array(particleCount * 3);
    const pColors = new Float32Array(particleCount * 3);
    const pSizes = new Float32Array(particleCount);
    const pPhase = new Float32Array(particleCount);
    const pLocal = new Float32Array(particleCount * 3);
    const pVelocity = new Float32Array(particleCount * 3);
    const pCellIndex = new Uint16Array(particleCount);
    const localBoundary = CONFIG.cellSize * 0.34;

    let pi = 0;
    for (let c = 0; c < cells.length; c++) {
      for (let k = 0; k < CONFIG.particlesPerCell; k++) {
        const i3 = pi * 3;
        pCellIndex[pi] = c;
        pPhase[pi] = Math.random() * Math.PI * 2;

        pLocal[i3] = rand(-localBoundary, localBoundary);
        pLocal[i3 + 1] = rand(-localBoundary, localBoundary);
        pLocal[i3 + 2] = rand(-localBoundary, localBoundary);

        const v = randomUnitVector().multiplyScalar(rand(0.060, 0.145));
        pVelocity[i3] = v.x;
        pVelocity[i3 + 1] = v.y;
        pVelocity[i3 + 2] = v.z;

        const b = rand(0.82, 1.0);
        pColors[i3] = b;
        pColors[i3 + 1] = b;
        pColors[i3 + 2] = b;
        pSizes[pi] = rand(2.2, 6.2);

        const base = cells[c].assembled;
        pPositions[i3] = base.x + pLocal[i3];
        pPositions[i3 + 1] = base.y + pLocal[i3 + 1];
        pPositions[i3 + 2] = base.z + pLocal[i3 + 2];
        pi++;
      }
    }

    const particleGeo = new THREE.BufferGeometry();
    particleGeo.setAttribute("position", new THREE.BufferAttribute(pPositions, 3));
    particleGeo.setAttribute("color", new THREE.BufferAttribute(pColors, 3));
    particleGeo.setAttribute("aSize", new THREE.BufferAttribute(pSizes, 1));
    particleGeo.setAttribute("aPhase", new THREE.BufferAttribute(pPhase, 1));

    const particleMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexColors: true,
      uniforms: {
        uTime: { value: 0 },
        uOpacity: { value: 0.90 },
        uScale: { value: CONFIG.particleBaseSize }
      },
      vertexShader: `
        attribute float aSize;
        attribute float aPhase;
        varying vec3 vColor;
        varying float vTwinkle;
        uniform float uTime;
        uniform float uScale;
        void main() {
          vColor = color;
          vTwinkle = 0.58 + 0.42 * sin(uTime * 2.8 + aPhase);
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = aSize * uScale * (1.0 / max(0.55, -mv.z));
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        varying vec3 vColor;
        varying float vTwinkle;
        uniform float uOpacity;
        void main() {
          vec2 uv = gl_PointCoord - 0.5;
          float d = length(uv);
          float core = smoothstep(0.18, 0.0, d);
          float halo = smoothstep(0.50, 0.0, d) * 0.45;
          float alpha = (core + halo) * vTwinkle * uOpacity;
          if (alpha < 0.01) discard;
          vec3 col = mix(vec3(0.72, 0.86, 1.0), vec3(1.0), core);
          gl_FragColor = vec4(col * vColor, alpha);
        }
      `
    });

    const particles = new THREE.Points(particleGeo, particleMat);
    cubeRoot.add(particles);

    const starPositions = new Float32Array(CONFIG.backgroundStars * 3);
    const starColors = new Float32Array(CONFIG.backgroundStars * 3);
    const starSizes = new Float32Array(CONFIG.backgroundStars);
    for (let i = 0; i < CONFIG.backgroundStars; i++) {
      const v = randomUnitVector().multiplyScalar(rand(11, 36));
      v.z -= rand(5, 19);
      const i3 = i * 3;
      starPositions[i3] = v.x * 1.18;
      starPositions[i3 + 1] = v.y * 0.70;
      starPositions[i3 + 2] = v.z;
      const b = rand(0.28, 0.74);
      starColors[i3] = b;
      starColors[i3 + 1] = b;
      starColors[i3 + 2] = b;
      starSizes[i] = rand(1.0, 2.4);
    }

    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute("position", new THREE.BufferAttribute(starPositions, 3));
    starGeo.setAttribute("color", new THREE.BufferAttribute(starColors, 3));
    starGeo.setAttribute("aSize", new THREE.BufferAttribute(starSizes, 1));
    const starMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexColors: true,
      uniforms: { uTime: { value: 0 }, uOpacity: { value: 0.28 } },
      vertexShader: `
        attribute float aSize;
        varying vec3 vColor;
        varying float vA;
        uniform float uTime;
        void main() {
          vColor = color;
          vA = 0.65 + 0.35 * sin(uTime * 0.7 + position.x * 0.21);
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = aSize * (7.0 / max(0.55, -mv.z));
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        varying vec3 vColor;
        varying float vA;
        uniform float uOpacity;
        void main() {
          vec2 uv = gl_PointCoord - 0.5;
          float d = length(uv);
          float a = smoothstep(0.48, 0.0, d) * uOpacity * vA;
          if (a < 0.01) discard;
          gl_FragColor = vec4(vColor, a);
        }
      `
    });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    let targetOpen = 0.0;
    let openState = 0.0;
    let handLandmarker = null;
    let handReady = false;
    let lastVideoTime = -1;
    let lastGesture = "fist";
    let stableFrames = 0;
    let statusVisible = true;
    let targetCameraZ = CONFIG.cameraBaseZ;
    let currentCameraZ = CONFIG.cameraBaseZ;

    function setOpen(v) {
      targetOpen = THREE.MathUtils.clamp(v, 0, 1);
    }

    function hideStartUI() {
      startOverlay.classList.add("hidden");
      window.setTimeout(() => { startOverlay.style.display = "none"; }, 470);
    }

    function fadeStatusSoon() {
      window.setTimeout(() => {
        statusEl.classList.add("hidden");
        statusVisible = false;
      }, 1800);
    }

    async function enableCameraOnly() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      document.body.classList.add("camera-on");
    }

    async function enableHandTracking() {
      hideStartUI();
      statusEl.textContent = "loading hand tracking · keyboard still works";
      try {
        await enableCameraOnly();
        const vision = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");
        const fileset = await vision.FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );
        handLandmarker = await vision.HandLandmarker.createFromOptions(fileset, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numHands: 1
        });
        handReady = true;
        statusEl.textContent = "gesture active · open hand=scatter · fist=assemble · OK=far · V=near";
        fadeStatusSoon();
      } catch (err) {
        console.warn(err);
        handReady = false;
        statusEl.textContent = "camera unavailable · use O/Space and F";
      }
    }

    startBtn.addEventListener("click", enableHandTracking);

    window.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      if (k === "o" || k === " ") setOpen(1);
      if (k === "f") setOpen(0);
      if (k === "1") targetCameraZ = CONFIG.cameraFarZ;
      if (k === "2") targetCameraZ = CONFIG.cameraNearZ;
      if (k === "3") targetCameraZ = CONFIG.cameraBaseZ;
      if (k === "h") {
        statusVisible = !statusVisible;
        statusEl.classList.toggle("hidden", !statusVisible);
      }
    });

    window.addEventListener("pointermove", (e) => {
      if (!handReady && e.buttons === 1) {
        const x = e.clientX / Math.max(1, window.innerWidth);
        setOpen(x);
      }
    });

    window.addEventListener("wheel", (e) => {
      targetCameraZ = THREE.MathUtils.clamp(targetCameraZ + Math.sign(e.deltaY) * 0.28, CONFIG.cameraNearZ, CONFIG.cameraFarZ);
    }, { passive: true });

    function landmarkDistance(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      const dz = (a.z || 0) - (b.z || 0);
      return Math.sqrt(dx * dx + dy * dy + dz * dz);
    }

    function fingerExtended(hand, tipIndex, pipIndex) {
      const wrist = hand[0];
      return landmarkDistance(hand[tipIndex], wrist) > landmarkDistance(hand[pipIndex], wrist) * 1.20;
    }

    function thumbExtended(hand) {
      return landmarkDistance(hand[4], hand[2]) > landmarkDistance(hand[3], hand[2]) * 1.08;
    }

    function countExtendedFingers(hand) {
      let extended = 0;
      if (fingerExtended(hand, 8, 6)) extended++;
      if (fingerExtended(hand, 12, 10)) extended++;
      if (fingerExtended(hand, 16, 14)) extended++;
      if (fingerExtended(hand, 20, 18)) extended++;
      if (thumbExtended(hand)) extended++;
      return extended;
    }

    function detectVGesture(hand) {
      const indexExt = fingerExtended(hand, 8, 6);
      const middleExt = fingerExtended(hand, 12, 10);
      const ringExt = fingerExtended(hand, 16, 14);
      const pinkyExt = fingerExtended(hand, 20, 18);
      const split = landmarkDistance(hand[8], hand[12]);
      const palmScale = Math.max(0.001, landmarkDistance(hand[0], hand[9]));
      return indexExt && middleExt && !ringExt && !pinkyExt && split > palmScale * 0.38;
    }

    function detectOKGesture(hand) {
      const thumbIndexDist = landmarkDistance(hand[4], hand[8]);
      const palmScale = Math.max(0.001, landmarkDistance(hand[0], hand[9]));
      const middleExt = fingerExtended(hand, 12, 10);
      const ringExt = fingerExtended(hand, 16, 14);
      const pinkyExt = fingerExtended(hand, 20, 18);
      const openBackFingers = [middleExt, ringExt, pinkyExt].filter(Boolean).length;
      return thumbIndexDist < palmScale * 0.34 && openBackFingers >= 2;
    }

    function classifyGesture(hand) {
      if (detectOKGesture(hand)) return "zoom-far";
      if (detectVGesture(hand)) return "zoom-near";
      const count = countExtendedFingers(hand);
      if (count >= 4) return "open";
      if (count <= 1) return "fist";
      return "unknown";
    }

    function updateHandTracking() {
      if (!handReady || !handLandmarker || video.readyState < 2) return;
      if (video.currentTime === lastVideoTime) return;
      lastVideoTime = video.currentTime;

      const result = handLandmarker.detectForVideo(video, performance.now());
      if (!result.landmarks || result.landmarks.length === 0) return;

      const hand = result.landmarks[0];
      const gesture = classifyGesture(hand);
      if (gesture === "unknown") return;

      if (gesture === lastGesture) stableFrames++;
      else { lastGesture = gesture; stableFrames = 1; }

      if (stableFrames >= 3) {
        if (gesture === "open") {
          setOpen(1);
          statusEl.textContent = "open hand · scattered";
        }
        if (gesture === "fist") {
          setOpen(0);
          statusEl.textContent = "fist · assembled";
        }
        if (gesture === "zoom-far") {
          targetCameraZ = CONFIG.cameraFarZ;
          statusEl.textContent = "OK gesture · camera farther";
        }
        if (gesture === "zoom-near") {
          targetCameraZ = CONFIG.cameraNearZ;
          statusEl.textContent = "V gesture · camera closer";
        }
      }
    }

    function bounceLocal(i3, dt, o) {
      const maxSpeed = 0.235;
      pVelocity[i3] += Math.sin(clock.elapsedTime * 1.2 + pPhase[i3 / 3]) * dt * 0.012;
      pVelocity[i3 + 1] += Math.cos(clock.elapsedTime * 1.0 + pPhase[i3 / 3] * 0.7) * dt * 0.012;
      pVelocity[i3 + 2] += Math.sin(clock.elapsedTime * 0.9 + pPhase[i3 / 3] * 1.4) * dt * 0.012;

      const speed = Math.sqrt(pVelocity[i3] ** 2 + pVelocity[i3 + 1] ** 2 + pVelocity[i3 + 2] ** 2);
      if (speed > maxSpeed) {
        pVelocity[i3] = pVelocity[i3] / speed * maxSpeed;
        pVelocity[i3 + 1] = pVelocity[i3 + 1] / speed * maxSpeed;
        pVelocity[i3 + 2] = pVelocity[i3 + 2] / speed * maxSpeed;
      }

      const localDt = dt * (1.25 + o * 0.95);
      for (let axis = 0; axis < 3; axis++) {
        const idx = i3 + axis;
        pLocal[idx] += pVelocity[idx] * localDt;
        if (pLocal[idx] > localBoundary) {
          pLocal[idx] = localBoundary;
          pVelocity[idx] *= -1;
        } else if (pLocal[idx] < -localBoundary) {
          pLocal[idx] = -localBoundary;
          pVelocity[idx] *= -1;
        }
      }
    }

    function updateCellsAndParticles(dt, t) {
      openState += (targetOpen - openState) * (1 - Math.pow(0.00085, dt));
      const o = THREE.MathUtils.smoothstep(openState, 0, 1);

      for (let i = 0; i < cells.length; i++) {
        const cell = cells[i];
        const floating = Math.sin(t * 0.68 + cell.phase) * 0.045 * (0.2 + o);
        const target = cell.assembled.clone().lerp(cell.dispersed, o);
        target.y += floating;
        cell.group.position.lerp(target, 0.078);

        cell.group.scale.set(1, 1, 1);
        cell.group.rotation.x += (cell.rotationOpen.x * o - cell.group.rotation.x) * 0.065;
        cell.group.rotation.y += (cell.rotationOpen.y * o - cell.group.rotation.y) * 0.065;
        cell.group.rotation.z += (cell.rotationOpen.z * o - cell.group.rotation.z) * 0.065;

        const pulse = 0.5 + 0.5 * Math.sin(t * 1.45 + cell.phase);
        cell.mesh.material.opacity = THREE.MathUtils.lerp(0.150, 0.115, o) + pulse * 0.010;
        cell.mesh.material.emissiveIntensity = THREE.MathUtils.lerp(0.14, 0.24, o) + pulse * 0.028;
        cell.edges.material.opacity = THREE.MathUtils.lerp(0.58, 0.70, o) + pulse * 0.025;
        cell.softEdges.material.opacity = THREE.MathUtils.lerp(0.14, 0.24, o);
      }

      for (let i = 0; i < particleCount; i++) {
        const i3 = i * 3;
        bounceLocal(i3, dt, o);

        const cell = cells[pCellIndex[i]];
        const local = new THREE.Vector3(
          pLocal[i3],
          pLocal[i3 + 1],
          pLocal[i3 + 2]
        );
        local.applyEuler(cell.group.rotation);
        pPositions[i3] = cell.group.position.x + local.x;
        pPositions[i3 + 1] = cell.group.position.y + local.y;
        pPositions[i3 + 2] = cell.group.position.z + local.z;
      }

      particleGeo.attributes.position.needsUpdate = true;
      particleMat.uniforms.uTime.value = t;
      particleMat.uniforms.uOpacity.value = THREE.MathUtils.lerp(0.66, 0.96, o);
      particleMat.uniforms.uScale.value = THREE.MathUtils.lerp(3.7, 5.4, o);
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.033);
      const t = clock.elapsedTime;

      updateHandTracking();
      updateCellsAndParticles(dt, t);

      root.rotation.x = Math.sin(t * 0.16) * 0.055 - 0.035;
      root.rotation.y = Math.sin(t * 0.12) * 0.14 + t * 0.030;
      root.rotation.z = Math.sin(t * 0.10) * 0.016;

      stars.rotation.y = t * 0.005;
      starMat.uniforms.uTime.value = t;

      currentCameraZ += (targetCameraZ - currentCameraZ) * 0.065;
      camera.position.x = Math.sin(t * 0.10) * 0.22;
      camera.position.y = 0.28 + Math.sin(t * 0.12) * 0.11;
      camera.position.z = currentCameraZ + Math.cos(t * 0.08) * 0.05;
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    });

    animate();
  </script>
</body>
</html>
